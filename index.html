<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TextCraft is a website where you can edit text and save it as a file">
    <link rel="stylesheet" href="style.css">
    <title>TextCraft</title>
</head>
<body>
    <header class="header">
        <p>TextCraft</p>
    </header>

    <main>
        <section class="grid-container">
            <div class="text-display txt-container">
                <div class="text-background">
                    <p class="text-placeholder" id="textDisplayer">Haii :D</p>
                </div>
            </div>

            <div class="text-propreties txt-container">
                <p class="prop-title">Properties</p>
                <hr>
                <ul class="props-list">
                    
                    <ul class="sub-settings">
                        <p class="sub-title">Main Settings:</p>
                        <li class="prop-config">
                            <label for="textFont">Font:</label>
                            <select id="textFont">
                                <option value="Schoolbell" selected style="font-family: Schoolbell;">Schoolbell</option>
                                <option value="Arial" style="font-family: Arial;">Arial</option>
                                <option value="Pixelify Sans" style="font-family: 'Pixelify Sans';">Pixelify Sans</option>
                                <option value="Coral Pixels" style="font-family: 'Coral Pixels';">Coral Pixels</option>
                                <option value="Montserrat" style="font-family: Montserrat;">Montserrat</option>
                                <option value="Rubik" style="font-family: Rubik;">Rubik</option>
                                <option value="monospace" style="font-family: monospace;">monospace</option>
                                <option value="cursive" style="font-family: cursive;">cursive</option>
                            </select>
                        </li>

                        <li class="prop-config">
                            <label for="textColor">Color:</label>
                            <input type="color" id="textColor">
                        </li>

                        <li class="prop-config">
                            <label for="textFontSize">Size:</label>
                            <input type="number" id="textFontSize" min="1" max="56" value="50">
                        </li>

                        <li class="prop-config">
                            <label for="textFontWeight">Weight:</label>
                            <select id="textFontWeight">
                                <option value="100">100</option>
                                <option value="200">200</option>
                                <option value="300">300</option>
                                <option value="400" selected>400</option>
                                <option value="500">500</option>
                                <option value="600">600</option>
                                <option value="700">700</option>
                                <option value="800">800</option>
                                <option value="900">900</option>
                            </select>
                        </li>
                    </ul>
                    
                    <ul class="sub-settings">
                        <p class="sub-title">Shadow Settings:</p>
                        <li class="prop-config">
                            <label for="ShadowColor">Shadow?:</label>
                            <input type="checkbox" id="ShadowCheck">
                        </li>
                        <li class="prop-config">
                            <label for="ShadowColor">Color:</label>
                            <input type="color" id="ShadowColor" value="#000000">
                        </li>
                    </ul>

                </ul>

            </div>

            <div class="text-inputer txt-container">
                <input type="text" placeholder="Your Text Goes Here" id="textInput" value="Haii :D">
            </div>

            <div>
                <button id="downloadButton">Download</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
